# OWASP CRS Plugin
# Plugin name: wordpress-rule-exclusions
# Plugin description: 
# Rule ID block base: 9,507,000 - 9,507,999
# Plugin version: 1.2.0

# Generic rule to disable the plugin
#
# Plugins are enabled by default.
#
# They become active by placing them in the plugin folder. It is possible to
# control plugin activation via setting a variable. This can be done in the
# plugin config file here.
#
# The predefined variable name is meant to be "<plugin name>-plugin_enabled".
# For the wordpress-rule-exclusions-plugin, this means it can be disabled by setting
# tx.wordpress-rule-exclusions-plugin_enabled=0.
#
# Note that a global setting of this variable overrides the setting here.
# That means the "enabled" variable is only set by this rule if it has not
# been set before.
#
# Feel free to set the variable unconditionally here by replacing the
# SecRule line with an unconditional SecAction statement.
#
# SecRule &TX:wordpress-rule-exclusions-plugin_enabled "@eq 0" \
#     "id:9507010,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ver:'wordpress-rule-exclusions-plugin/1.2.0',\
#     setvar:'tx.wordpress-rule-exclusions-plugin_enabled=0'"


# Restrict the plugin to a sub-directory (optional)
#
# If WordPress is installed in a sub-directory (e.g. /blog/) and the same host
# also serves other applications, set tx.wordpress-rule-exclusions-plugin_path
# to the WordPress path prefix. The plugin is then only applied to requests
# whose path begins with that prefix (rule 9507090). If the variable is not
# set, the plugin behaves as before and applies to every request.
#
# The prefix is compared with REQUEST_FILENAME using @beginsWith, so it should
# start with "/" and end with "/".
#
# SecAction \
#     "id:9507011,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ver:'wordpress-rule-exclusions-plugin/1.2.0',\
#     setvar:'tx.wordpress-rule-exclusions-plugin_path=/blog/'"
#
# The variable can also be set conditionally, for example per host:
#
# SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?example\.com(?::[0-9]+)?$" \
#     "id:9507012,\
#     phase:1,\
#     pass,\
#     t:none,t:lowercase,\
#     nolog,\
#     ver:'wordpress-rule-exclusions-plugin/1.2.0',\
#     setvar:'tx.wordpress-rule-exclusions-plugin_path=/blog/'"
#
# Several WordPress installations on the same host can be covered by
# capturing the prefix of the current request. Set a prefix that never
# matches first, so that the other paths of the host stay outside the
# plugin:
#
# SecAction \
#     "id:9507013,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ver:'wordpress-rule-exclusions-plugin/1.2.0',\
#     setvar:'tx.wordpress-rule-exclusions-plugin_path=/-no-wordpress-/'"
#
# SecRule REQUEST_FILENAME "@rx ^/(?:blog|news)/" \
#     "id:9507014,\
#     phase:1,\
#     pass,\
#     t:none,\
#     nolog,\
#     capture,\
#     ver:'wordpress-rule-exclusions-plugin/1.2.0',\
#     setvar:'tx.wordpress-rule-exclusions-plugin_path=%{TX.0}'"
