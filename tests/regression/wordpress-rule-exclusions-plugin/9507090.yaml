---
meta:
  author: "Gen Tobimatsu"
  description: "Wordpress Rule Exclusions Plugin - path restriction is off by default"
rule_id: 9507090
# Without tx.wordpress-rule-exclusions-plugin_path the plugin applies to every
# request, as before. Tests with the variable set are in tests/path-restriction.
tests:
  - test_id: 1
    desc: Without a configured prefix, a block editor save in a sub-directory is excluded
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS test agent
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
            x-http-method-override: PUT
          port: 80
          method: POST
          version: "HTTP/1.1"
          uri: /blog/wp-json/wp/v2/posts/1
          data: '{"id":1,"content":"<!-- wp:paragraph -->\n<p>test</p>\n<!-- /wp:paragraph -->"}'
        output:
          log:
            no_expect_ids: [920450]
