# Test-only configuration for tests/path-restriction/9507090.yaml.
# Install it next to the plugin files (it is picked up as a *-config.conf
# file) so that tx.wordpress-rule-exclusions-plugin_path is set for the test
# hosts only. Do not use it in production.
SecRule REQUEST_HEADERS:Host "@streq subdir.example.test" "id:9507011,phase:1,pass,nolog,t:none,t:lowercase,setvar:'tx.wordpress-rule-exclusions-plugin_path=/blog/'"
SecRule REQUEST_HEADERS:Host "@streq multi.example.test" "id:9507013,phase:1,pass,nolog,t:none,t:lowercase,setvar:'tx.wordpress-rule-exclusions-plugin_path=/-no-wordpress-/'"
SecRule REQUEST_HEADERS:Host "@streq multi.example.test" "id:9507014,phase:1,pass,nolog,t:none,t:lowercase,chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:site-a|site-b)/" "t:none,capture,setvar:'tx.wordpress-rule-exclusions-plugin_path=%{TX.0}'"
